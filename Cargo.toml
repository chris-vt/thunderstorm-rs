[workspace]
members = [
    "crates/thunderstorm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Chris Torres"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Fast hash tables without SipHash overhead
hashbrown = { version = "0.14", features = ["serde"] }
# Small vector optimization (avoids heap allocation for 1-4 elements)
smallvec = { version = "1.13", features = ["serde"] }
# Fast bitset operations for graph closures & sets
roaring = { version = "0.10", features = ["serde"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
